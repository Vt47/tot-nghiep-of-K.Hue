<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#eac868"/>
      <stop offset="70%" stop-color="#c99f38"/>
      <stop offset="100%" stop-color="#8d6b1d"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4aa42"/>
      <stop offset="100%" stop-color="#7a5a12"/>
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae79d"/>
      <stop offset="50%" stop-color="#d9ac42"/>
      <stop offset="100%" stop-color="#9a7420"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#capShadow)">
    <!-- Skullcap Base -->
    <path d="M48 68 Q 80 92 112 68 L 108 86 Q 80 102 52 86 Z" fill="url(#goldCap)" stroke="#b58a27" stroke-width="1"/>
    
    <!-- Diamond Top -->
    <polygon points="80,24 140,54 80,78 20,54" fill="url(#goldTop)" stroke="#eed17b" stroke-width="1.2"/>
    
    <!-- Top button -->
    <ellipse cx="80" cy="52" rx="4" ry="2.5" fill="#fdf0b5" stroke="#9a7420" stroke-width="0.8"/>
    
    <!-- Tassel cord -->
    <path d="M80 52 C 105 58, 128 72, 134 88" stroke="url(#goldTassel)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tassel ring -->
    <ellipse cx="134" cy="89" rx="3.5" ry="2" fill="#7a5a12"/>
    
    <!-- Tassel body -->
    <path d="M131 90 L 137 90 L 143 124 L 125 124 Z" fill="url(#goldTassel)"/>
    <!-- Tassel fringe details -->
    <line x1="128" y1="124" x2="128" y2="128" stroke="#9a7420" stroke-width="1"/>
    <line x1="131" y1="124" x2="131" y2="129" stroke="#fae79d" stroke-width="1"/>
    <line x1="134" y1="124" x2="134" y2="128" stroke="#d9ac42" stroke-width="1"/>
    <line x1="137" y1="124" x2="137" y2="130" stroke="#fae79d" stroke-width="1"/>
    <line x1="140" y1="124" x2="140" y2="128" stroke="#9a7420" stroke-width="1"/>
  </g>
</svg>
